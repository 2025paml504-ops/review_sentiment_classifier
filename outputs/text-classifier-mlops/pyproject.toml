[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-classifier-mlops"
version = "0.1.0"
description = "End-to-end text classification MLOps case study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "mlflow-skinny>=2.10,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.26,<1", "pytest>=8,<9", "ruff>=0.6,<1"]
transformer = ["datasets>=2.18,<4", "evaluate>=0.4,<1", "torch>=2.1,<3", "transformers>=4.38,<5", "accelerate>=0.27,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
