stages:
  build_features:
    cmd: python -m features.build_features
    deps:
      - features/build_features.py
      - data/raw/Hotel_Reviews.csv
    outs:
      - data/interim/features_clean.csv

  validate:
    cmd: python -m validation.validate_data
    deps:
      - data/interim/features_clean.csv
      - validation/validate_data.py
      - validation/feature_column.json
    always_changed: true

  feature_store:
    cmd: python -m feature_store.feature_store
    deps:
      - data/interim/features_clean.csv
      - feature_store/feature_store.py
    outs:
      - feature_store/feature_store.db

  vectorize:
    cmd: python -m features.vectorize
    deps:
      - feature_store/feature_store.db
      - features/vectorize.py
    outs:
      - data/processed/train_v1.csv
      - data/processed/test_v1.csv
      - model_store/tfidf_vectorizer_v1.pkl

  train:
    cmd: python -m training.train_linear
    deps:
      - data/processed/train_v1.csv
      - data/processed/test_v1.csv
      - model_store/tfidf_vectorizer_v1.pkl
      - training/train_linear.py
      - training/tracking.py
      # Every run logs the feature-store snapshot and the column contract
      # (decisions §18), so both are inputs to the record this stage produces.
      - feature_store/feature_store.py
      - validation/feature_column.json
    outs:
      - model_store/logreg_v1.pkl
    metrics:
      - training/metrics_logreg.json:
          cache: false

  # The comparison model. Same inputs as `train`, only the estimator differs, so
  # the two are a like-for-like pair; declaring it as a stage is what keeps
  # linear_svc in the MLflow leaderboard instead of behind a manual flag.
  train_linear_svc:
    cmd: python -m training.train_linear --model linear_svc
    deps:
      - data/processed/train_v1.csv
      - data/processed/test_v1.csv
      - model_store/tfidf_vectorizer_v1.pkl
      - training/train_linear.py
      - training/tracking.py
      - feature_store/feature_store.py
      - validation/feature_column.json
    outs:
      - model_store/linear_svc_v1.pkl
    metrics:
      - training/metrics_linear_svc.json:
          cache: false

  # Recurrent baseline (v1.2). It does *not* depend on the
  # TF-IDF vectorizer: a recurrent net needs ordered token ids, so this trainer
  # builds its own word index from the same train split.
  train_rnn:
    cmd: python -m training.train_rnn
    deps:
      - data/processed/train_v1.csv
      - data/processed/test_v1.csv
      - training/train_rnn.py
      - training/tracking.py
      - feature_store/feature_store.py
      - validation/feature_column.json
    outs:
      - model_store/rnn_lstm_v1.pt
      - model_store/rnn_lstm_v1_vocab.json
    metrics:
      - training/metrics_rnn_lstm.json:
          cache: false

  train_transformer:
    cmd: python -m training.train_transformer
    deps:
      - data/processed/train_v1.csv
      - data/processed/test_v1.csv
      - training/train_transformer.py
      - training/tracking.py
      - feature_store/feature_store.py
      - validation/feature_column.json
    outs:
      - model_store/bert_mini_v1
    metrics:
      - training/metrics_transformer.json:
          cache: false
